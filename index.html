  {city:"Екатеринбург",title:"Менеджер по подбору персонала",emp:"Митрофанов И.В.",salary:"60 000 — 110 000 руб./мес.",loc:"Удаленно",tags:["Студентам"],part:true,perm:false,remote:true,noexp:true,students:true,url:"https://eburg.rabota.ru/vacancy/54296937/"},
  {city:"Екатеринбург",title:"Оператор колл-центра (входящая линия)",emp:"Первый виртуальный оператор",salary:"30 000 — 40 000 руб./мес.",loc:"Удаленно",tags:["Студентам"],part:true,perm:false,remote:true,noexp:true,students:true,url:"https://eburg.rabota.ru/vacancy/48582426/"},
];

const CITIES = ["Москва", "Санкт-Петербург", "Екатеринбург"];
let currentCity = "Москва";
const active = new Set(['part']);

// city picker
document.getElementById('city-btn').addEventListener('click', () => {
  document.getElementById('city-overlay').classList.add('open');
  renderCityList();
});
document.getElementById('city-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('city-overlay'))
    document.getElementById('city-overlay').classList.remove('open');
});

function renderCityList() {
  document.getElementById('city-list').innerHTML = CITIES.map(c =>
    `<button class="city-item${c===currentCity?' selected':''}" data-c="${c}">${c}</button>`
  ).join('');
  document.querySelectorAll('.city-item').forEach(b => {
    b.addEventListener('click', () => {
      currentCity = b.dataset.c;
      document.getElementById('city-label').textContent = currentCity;
      document.getElementById('city-overlay').classList.remove('open');
      render();
    });
  });
}

// filters
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.f, other = f==='part'?'perm':'part';
    active.has(f) ? (active.delete(f), btn.classList.remove('active')) : (active.add(f), btn.classList.add('active'), active.delete(other), document.querySelector(`.toggle-btn[data-f="${other}"]`).classList.remove('active'));
    render();
  });
});
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    const f = c.dataset.f;
    active.has(f) ? (active.delete(f), c.classList.remove('active')) : (active.add(f), c.classList.add('active'));
    render();
  });
});

function render() {
  const filtered = vacancies.filter(v => {
    if (v.city !== currentCity) return false;
    for (const f of active) if (!v[f]) return false;
    return true;
  });
  document.getElementById('results-bar').textContent = filtered.length + ' вакансий';
  const list = document.getElementById('list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🤷‍♂️</div><div class="empty-title">Пока ничего не нашлось</div><div class="empty-sub">Попробуй отключить часть фильтров</div></div>';
    return;
  }
  list.innerHTML = filtered.map(v => `
    <div class="card">
      <div class="card-top">
        <div>
          <div><span class="emp-badge">${v.emp}</span></div>
          <div><span class="src-badge">от Работа.ру</span></div>
        </div>
        <div class="card-dist">📍 ${v.loc}</div>
      </div>
      <div class="card-title">${v.title}</div>
      <div class="card-salary">${v.salary}</div>
      ${v.tags.length?`<div class="card-tags">${v.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      <button class="btn-apply" onclick="window.open('${v.url}','_blank')">Откликнуться →</button>
    </div>
  `).join('');
}

render();

setTimeout(() => {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}, 600);
</script>
</body>
</html>
